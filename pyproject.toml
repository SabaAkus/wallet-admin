[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "wallet-admin"
version = "0.1.0"
description = "Local admin panel foundation for wallet transaction review"
requires-python = ">=3.13"
dependencies = [
    "alembic>=1.16,<2",
    "Flask>=3.1,<4",
    "Flask-Login>=0.6,<1",
    "Flask-WTF>=1.2,<2",
    "SQLAlchemy>=2.0,<3",
]

[project.optional-dependencies]
test = ["pytest>=8.4,<10"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
